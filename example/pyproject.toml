[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "dagster-example"
version = "0.1.0"
description = "Example Dagster project for testing VS Code extension"
dependencies = [
    "dagster>=1.0.0",
    "pandas>=1.3.0"
]

[tool.dagster]
module_name = "example"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_example"
